---
- name: Install and configure Nginx reverse proxy
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy Nginx configuration
      ansible.builtin.copy:
        src: ../files/nginx.conf
        dest: /etc/nginx/sites-available/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx
# it is needed to disable the default nginx because otherwise there would be two concurrently running instance
    - name: Disable Debian default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Enable application site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/nginx.conf
        dest: /etc/nginx/sites-enabled/nginx.conf
        state: link
      notify: Reload Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded